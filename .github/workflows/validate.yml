name: Validate UniversityScope
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt nbformat
      - run: python -m unittest discover -s tests -v
      - run: python build_notebook.py --check
      - run: python -c "import nbformat; nbformat.validate(nbformat.read('UniversityScope.ipynb',as_version=4))"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
